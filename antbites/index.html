<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Antbites</title><link rel="icon" href="icon.png"><style>
:root{--wood:#ecc99c;--ink:#5c3821;--accent:#f5851f;--cream:#fdf2e3}
*{box-sizing:border-box}
body{margin:0;background:var(--wood);color:var(--ink);font:17px/1.55 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif}
main{max-width:720px;margin:32px auto;padding:28px 30px;background:var(--cream);border:4px solid #fff;border-radius:28px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
h1,h2{font-weight:900;line-height:1.2}h1{font-size:2em;margin:.2em 0}h2{font-size:1.2em;margin-top:1.6em}
a{color:#c4610b}ul{padding-left:1.2em}.muted{opacity:.7;font-size:.9em}
.hero{text-align:center}.hero img{width:128px;height:128px;border-radius:28px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.btn{display:inline-block;margin-top:12px;padding:10px 22px;background:var(--accent);color:#fff;border:3px solid #fff;border-radius:18px;font-weight:900;text-decoration:none}
</style></head>
<body><main class="hero">
<img src="icon.png" alt="Antbites icon">
<h1>Antbites</h1>
<p>A cozy puzzle game for iPhone. Hungry ants eat pixel pictures block by block: tap the columns to send the right colours in, and don't let the slots fill up.</p>
<p>Coming soon to the App Store.</p>
<a class="btn" href="privacy.html">Privacy Policy</a>
<p class="muted">Contact: <a href="mailto:skinilya@gmail.com">skinilya@gmail.com</a></p>
</main></body></html>
